<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>末日晶核 · 方塊世界</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
  .liquid-glass {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 8px 32px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.15) 0%,
      transparent 40%,
      transparent 60%,
      rgba(155,89,182,0.08) 100%);
    pointer-events: none;
  }

  .hero {
    min-height: 100vh;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(155,89,182,0.35), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(74,144,217,0.35), transparent 60%),
      linear-gradient(135deg, #0a0e14, #1a2230 50%, #0f1820);
    padding: 40px 20px;
  }

  /* 背景漂浮晶核 */
  .bg-core {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.6;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
  }
  .bg-core:nth-child(1) { width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(224,224,224,0.8), transparent 70%);
    left: 8%; top: 15%; animation-delay: 0s; }
  .bg-core:nth-child(2) { width: 60px; height: 60px;
    background: radial-gradient(circle, rgba(74,144,217,0.9), transparent 70%);
    right: 12%; top: 20%; animation-delay: -2s; }
  .bg-core:nth-child(3) { width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(155,89,182,0.7), transparent 70%);
    left: 15%; bottom: 15%; animation-delay: -4s; }
  .bg-core:nth-child(4) { width: 70px; height: 70px;
    background: radial-gradient(circle, rgba(231,76,60,0.8), transparent 70%);
    right: 10%; bottom: 20%; animation-delay: -6s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .glass-card {
    position: relative;
    z-index: 2;
    padding: 60px 48px;
    border-radius: 30px;
    text-align: center;
    color: #fff;
    max-width: 640px;
    width: 100%;
  }
  .glass-card h1 {
    font-family: var(--font-cn);
    font-size: clamp(36px, 7vw, 64px);
    letter-spacing: 6px;
    margin: 0 0 20px;
    color: #f7d06b;
    text-shadow:
      -2px 0 0 #3b2a12, 2px 0 0 #3b2a12,
       0 -2px 0 #3b2a12, 0 2px 0 #3b2a12,
       0 6px 0 rgba(0,0,0,0.35);
  }
  .glass-card .sub {
    max-width: 480px;
    margin: 0 auto 36px;
    line-height: 1.9;
    font-size: 15px;
    opacity: 0.9;
  }
  .hero-kicker {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    opacity: 0.75;
    margin-bottom: 20px;
  }
  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  @media (max-width: 600px) {
    .glass-card { padding: 40px 22px; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <a class="brand" href="index.html">
    <span class="brand-cube"></span>
    <span>末日晶核</span>
  </a>
  <nav class="nav-links">
    <a href="index.html" class="active">首頁</a>
    <a href="game.html">進入廢土</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="bg-core"></div>
    <div class="bg-core"></div>
    <div class="bg-core"></div>
    <div class="bg-core"></div>

    <div class="glass-card liquid-glass">
      <p class="hero-kicker">ZOMBIE APOCALYPSE · CORE SURVIVAL</p>
      <h1>末日晶核</h1>
      <p class="sub">
        擊殺喪屍、蒐集四色晶核，合成「扭曲之鑰」。<br>
        打開時空裂縫，來到十年後的未來——那裡再也沒有喪屍。
      </p>
      <div class="hero-actions">
        <a href="game.html" class="mc-btn mc-btn--lg">開始生存</a>
      </div>
    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
